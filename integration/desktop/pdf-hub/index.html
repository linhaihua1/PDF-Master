<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF 工作台</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">▤</span>
    <div>
      <h1>PDF 工作台</h1>
      <p class="sub">Stirling-PDF · PDFPatcher · ToolKnit 三引擎统一入口</p>
    </div>
  </div>
  <div class="engines" id="engines" aria-live="polite"></div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="搜功能、格式或场景，例如 压缩 / 书签 / word" autocomplete="off" />
  <div class="stats" id="stats">加载中…</div>
</div>

<main class="layout">
  <nav class="cats" id="cats" aria-label="分类"></nav>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle">—</h2>
      <p id="drawerDesc" class="muted"></p>
    </div>
    <button id="drawerClose" class="icon-btn" aria-label="关闭">✕</button>
  </div>

  <div class="drawer-body">
    <div class="field">
      <label for="files">选择文件</label>
      <input id="files" type="file" multiple />
      <p class="hint" id="filesHint"></p>
      <ul class="filelist" id="fileList"></ul>
    </div>

    <div id="options" class="options"></div>

    <div class="actions">
      <button id="runBtn" class="primary">开始处理</button>
      <button id="resetBtn" class="ghost">重置</button>
    </div>

    <div class="job" id="job" hidden>
      <div class="job-head">
        <span id="jobState" class="badge">—</span>
        <span id="jobId" class="muted mono"></span>
      </div>
      <ol class="logs" id="logs"></ol>
      <div id="outputs" class="outputs"></div>
    </div>
  </div>
</aside>

<div class="scrim" id="scrim" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
